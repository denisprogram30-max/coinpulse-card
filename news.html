<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>News Collage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-base:#090C16;
    --card-w:600px;
    --radius:24px;
    --text-1:#F5F7FB;
    --text-2:#9198AC;
    --accent-1:#3DD68C;
    --accent-2:#3B9EFF;
    --hair:rgba(255,255,255,0.08);
    --display:'Space Grotesk',sans-serif;
    --body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    min-height:100vh;background:#14161F;display:flex;align-items:center;justify-content:center;
    padding:40px 16px;font-family:var(--body);
  }

  .card{
    position:relative;width:var(--card-w);border-radius:var(--radius);overflow:hidden;
    background:var(--bg-base);box-shadow:0 30px 60px -20px rgba(0,0,0,.6);
  }

  .header{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 24px;background:linear-gradient(135deg,#0E1320,#0A0D16);
    border-bottom:1px solid var(--hair);
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand img{width:30px;height:30px;border-radius:8px;}
  .brand .name{
    font-family:var(--display);font-size:16px;font-weight:700;color:var(--text-1);letter-spacing:.02em;
  }
  .brand .name b{color:var(--accent-1);font-weight:700;}
  .header .tag{
    font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:.08em;
    color:var(--text-2);text-transform:uppercase;
    border:1px solid var(--hair);padding:6px 12px;border-radius:100px;
  }
  .header .tag::before{content:"Новости";}

  .grid{
    display:grid;gap:3px;background:var(--hair);
  }
  /* раскладки по числу картинок */
  .grid[data-n="1"]{grid-template-columns:1fr;}
  .grid[data-n="2"]{grid-template-columns:1fr 1fr;}
  .grid[data-n="3"]{grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;}
  .grid[data-n="3"] .cell:nth-child(1){grid-row:1 / span 2;}
  .grid[data-n="4"]{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;}

  .cell{
    position:relative;overflow:hidden;background:#0E1320;
    aspect-ratio:16/10;
  }
  .grid[data-n="1"] .cell{aspect-ratio:16/9;}
  .grid[data-n="3"] .cell:nth-child(1){aspect-ratio:auto;}
  .cell img{width:100%;height:100%;object-fit:cover;display:block;}
  .cell .fallback{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#0E1320,#141A28);
  }
  .cell .fallback img{width:44%;height:auto;opacity:.5;object-fit:contain;}
  .cell .num{
    position:absolute;top:10px;left:10px;z-index:2;
    width:26px;height:26px;border-radius:50%;
    background:rgba(9,12,22,.82);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--display);font-size:13px;font-weight:700;color:var(--text-1);
    border:1px solid var(--hair);
  }

  .footer{
    padding:16px 24px;display:flex;align-items:center;justify-content:space-between;
    background:linear-gradient(135deg,#0E1320,#0A0D16);border-top:1px solid var(--hair);
  }
  .footer .date{font-family:var(--display);font-size:13px;font-weight:600;color:var(--text-1);}
  .footer .more{font-family:var(--body);font-size:12px;color:var(--text-2);}

  .hint{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:11px;color:#5C6478;}
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="header">
      <div class="brand">
        <img id="brand-logo" alt="">
        <div class="name">Coin<b>Pulse</b></div>
      </div>
      <div class="tag"></div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="footer">
      <div class="date" id="date">20.08.2026</div>
      <div class="more">Дайджест криптоновостей</div>
    </div>
  </div>

  <div class="hint">Коллаж новостей — снимается элемент #card</div>

  const grid = document.getElementById("grid");
