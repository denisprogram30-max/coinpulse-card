<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Crypto Post Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-base:#090C16;
    --card-w:400px;
    --radius:26px;
    --text-1:#F5F7FB;
    --text-2:#9198AC;
    --text-3:#5C6478;
    --up:#3DD68C;
    --down:#FB6A6A;
    --hair:rgba(255,255,255,0.07);
    --display:'Space Grotesk',sans-serif;
    --body:'Inter',sans-serif;
    --mono:'JetBrains Mono',monospace;
  }

  [data-theme="morning"]{
    --accent-1:#FFB35C;
    --accent-2:#FF6F61;
    --sun:#FFD166;
    --glow: radial-gradient(120% 90% at 15% -10%, rgba(255,179,92,0.35), transparent 60%);
    --time:"09:00";
  }
  [data-theme="midday"]{
    --accent-1:#4FD1C5;
    --accent-2:#3B9EFF;
    --sun:#FFFFFF;
    --glow: radial-gradient(120% 90% at 50% -15%, rgba(79,209,197,0.30), transparent 60%);
    --time:"14:00";
  }
  [data-theme="evening"]{
    --accent-1:#C2477E;
    --accent-2:#7C5CFA;
    --sun:#E7D6FF;
    --glow: radial-gradient(120% 90% at 85% -10%, rgba(124,92,250,0.32), transparent 60%);
    --time:"20:00";
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    min-height:100vh;
    background:#14161F;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:22px;
    padding:40px 16px;
    font-family:var(--body);
  }

  .switch{
    display:flex;
    gap:6px;
    background:#1D1F2B;
    padding:5px;
    border-radius:100px;
    border:1px solid var(--hair);
  }
  .switch button{
    appearance:none;
    border:none;
    background:transparent;
    color:var(--text-2);
    font-family:var(--body);
    font-size:12.5px;
    font-weight:600;
    letter-spacing:0.02em;
    padding:8px 16px;
    border-radius:100px;
    cursor:pointer;
    transition:background .25s ease, color .25s ease;
  }
  .switch button[aria-pressed="true"]{
    background:#F5F7FB;
    color:#0B0C12;
  }

  .shot{
    width:600px;
    padding:40px 60px;
    background:radial-gradient(130% 100% at 50% 0%, #14161F 0%, #0B0D14 70%);
    display:flex;
    align-items:center;
    justify-content:center;
    box-sizing:border-box;
  }

  .card{
    position:relative;
    width:var(--card-w);
    border-radius:var(--radius);
    background:var(--bg-base);
    overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);
    isolation:isolate;
  }

  .fx-glow{
    position:absolute; inset:0;
    background:var(--glow);
    transition:background .4s ease;
    pointer-events:none;
  }
  .fx-grid{
    position:absolute; inset:0;
    background-image:
      linear-gradient(var(--hair) 1px, transparent 1px),
      linear-gradient(90deg, var(--hair) 1px, transparent 1px);
    background-size:34px 34px;
    mask-image:linear-gradient(180deg, rgba(0,0,0,0.5), transparent 55%);
    opacity:.5;
    pointer-events:none;
  }
  .fx-candles{
    position:absolute;
    right:-40px; bottom:-30px;
    width:230px; height:230px;
    opacity:.055;
    pointer-events:none;
  }
  .fx-logo{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:300px;
    height:300px;
    object-fit:contain;
    opacity:0.06;
    pointer-events:none;
    z-index:1;
    filter:grayscale(0.1);
  }

  .content{
    position:relative;
    z-index:2;
    height:100%;
    display:flex;
    flex-direction:column;
    padding:26px 26px 22px;
  }

  .head-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .brand-logo{
    width:22px; height:22px;
    border-radius:6px;
    object-fit:cover;
    flex-shrink:0;
  }
  .brand-name{
    font-family:var(--display);
    font-size:13px;
    font-weight:600;
    letter-spacing:0.10em;
    color:var(--text-1);
    text-transform:uppercase;
  }
  .date-pill{
    font-family:var(--mono);
    font-size:11px;
    color:var(--text-2);
    background:rgba(255,255,255,0.05);
    border:1px solid var(--hair);
    padding:5px 10px;
    border-radius:100px;
    letter-spacing:0.03em;
  }

  .arc-block{
    margin-top:16px;
    display:flex;
    align-items:center;
    gap:14px;
  }
  .arc-svg{ flex-shrink:0; display:block; }
  .arc-track{ fill:none; stroke:var(--hair); stroke-width:2; stroke-linecap:round; }
  .arc-sun{ fill:var(--sun); filter:drop-shadow(0 0 6px var(--sun)); transition:cx .3s ease, cy .3s ease, fill .3s ease; }

  .edition-time{
    font-family:var(--display);
    font-size:15px;
    font-weight:600;
    color:var(--text-1);
    letter-spacing:0.01em;
    line-height:1;
  }
  .edition-time::before{ content: var(--time); }

  .rule{
    margin:20px 0 6px;
    height:1px;
    background:linear-gradient(90deg, var(--hair), transparent);
  }

  .list{
    display:flex;
    flex-direction:column;
    flex:1;
  }
  .row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 0;
    border-bottom:1px solid var(--hair);
    opacity:0;
    transform:translateY(6px);
    animation:rise .5s ease forwards;
  }
  .row:last-child{ border-bottom:none; }
  .row:nth-child(1){ animation-delay:.03s; }
  .row:nth-child(2){ animation-delay:.06s; }
  .row:nth-child(3){ animation-delay:.09s; }
  .row:nth-child(4){ animation-delay:.12s; }
  .row:nth-child(5){ animation-delay:.15s; }
  .row:nth-child(6){ animation-delay:.18s; }
  .row:nth-child(7){ animation-delay:.21s; }
  .row:nth-child(8){ animation-delay:.24s; }
  .row:nth-child(9){ animation-delay:.27s; }
  .row:nth-child(10){ animation-delay:.30s; }
  @keyframes rise{ to{ opacity:1; transform:translateY(0); } }
  @media (prefers-reduced-motion: reduce){
    .row{ animation:none; opacity:1; transform:none; }
  }

  .coin-icon{
    width:29px; height:29px;
    border-radius:50%;
    object-fit:cover;
    background:rgba(255,255,255,0.04);
    flex-shrink:0;
  }

  .coin-id{ flex:1; min-width:0; }
  .coin-name{
    font-family:var(--display);
    font-size:14px;
    font-weight:600;
    color:var(--text-1);
  }
  .coin-ticker{
    font-family:var(--mono);
    font-size:10px;
    color:var(--text-3);
    letter-spacing:0.03em;
  }

  .spark{ flex-shrink:0; opacity:.9; }

  .coin-nums{
    text-align:right;
    flex-shrink:0;
    min-width:86px;
  }
  .coin-price{
    font-family:var(--mono);
    font-size:13.5px;
    font-weight:600;
    color:var(--text-1);
    font-variant-numeric:tabular-nums;
  }
  .coin-change{
    margin-top:1px;
    font-family:var(--mono);
    font-size:11px;
    font-weight:600;
    font-variant-numeric:tabular-nums;
  }
  .up{ color:var(--up); }
  .down{ color:var(--down); }

  .foot{
    margin-top:16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .foot-tag{
    font-family:var(--body);
    font-size:11px;
    color:var(--text-3);
  }
  .foot-cta{
    font-family:var(--mono);
    font-size:11px;
    color:var(--text-2);
    padding:6px 11px;
    border:1px solid var(--hair);
    border-radius:100px;
  }

  .hint{
    max-width:400px;
    text-align:center;
    font-family:var(--body);
    font-size:12px;
    line-height:1.5;
    color:#71778A;
  }
  .hint b{ color:#A6ABBB; }
</style>
</head>
<body>

  <div class="switch" role="tablist" aria-label="Выпуск">
    <button type="button" data-theme="morning" aria-pressed="true">Утро</button>
    <button type="button" data-theme="midday" aria-pressed="false">Обед</button>
    <button type="button" data-theme="evening" aria-pressed="false">Вечер</button>
  </div>

  <div class="card" id="card" data-theme="morning">
    <div class="fx-glow"></div>
    <div class="fx-grid"></div>
    <img class="fx-logo" id="fx-logo" alt="" aria-hidden="true">
    <svg class="fx-candles" viewBox="0 0 100 100" fill="none">
      <g stroke="#FFFFFF" stroke-width="2">
        <line x1="10" y1="10" x2="10" y2="45"/><rect x="6" y="20" width="8" height="15" fill="#FFFFFF"/>
        <line x1="28" y1="25" x2="28" y2="70"/><rect x="24" y="35" width="8" height="20" fill="#FFFFFF"/>
        <line x1="46" y1="5" x2="46" y2="55"/><rect x="42" y="15" width="8" height="25" fill="#FFFFFF"/>
        <line x1="64" y1="40" x2="64" y2="90"/><rect x="60" y="50" width="8" height="18" fill="#FFFFFF"/>
        <line x1="82" y1="15" x2="82" y2="60"/><rect x="78" y="28" width="8" height="22" fill="#FFFFFF"/>
      </g>
    </svg>

    <div class="content">
      <div class="head-top">
        <div class="date-pill" id="date-pill">20.08.2026</div>
        <div class="brand">
          <img class="brand-logo" id="brand-logo" alt="">
          <div class="brand-name">Crypto&nbsp;Digest</div>
        </div>
      </div>

      <div class="arc-block">
        <svg class="arc-svg" width="56" height="34" viewBox="0 0 56 34">
          <path class="arc-track" d="M4,30 A24,24 0 0 1 52,30"/>
          <circle class="arc-sun" id="arc-sun" cx="10" cy="26" r="4"/>
        </svg>
        <div class="edition-time"></div>
      </div>

      <div class="rule"></div>

      <div class="list" id="list"></div>
    </div>
  </div>

  <div class="hint">
    Шаблон для скрипта: массив <b>coins</b> в JS ниже — точка подстановки данных из n8n.<br>
    Высота карточки теперь авто (растёт под 10 строк) — в скриншот-ноде снимайте по границам элемента <b>#card</b> с шириной вьюпорта 1080px и deviceScaleFactor 2, а не по фиксированному 1080×1350.
  </div>

  };

  // Точка подстановки: в n8n этот массив заменяется реальными данными с прошлого шага (Merge/Claude/RSS)
  const coins = [
    { icon:"₿", name:"Bitcoin",  ticker:"BTC",  price:"$69 398,45", change:8.02,   up:true },
    { icon:"Ξ", name:"Ethereum", ticker:"ETH",  price:"$2 247,81",  change:17.64,  up:true },
    { icon:"B", name:"BNB",      ticker:"BNB",  price:"$601,59",    change:-0.28,  up:false },
    { icon:"S", name:"Solana",   ticker:"SOL",  price:"$76,94",     change:1.17,   up:true },
    { icon:"X", name:"XRP",      ticker:"XRP",  price:"$1,004",     change:0.68,   up:true },
    { icon:"◆", name:"Toncoin",  ticker:"TON",  price:"$6,42",      change:2.15,   up:true },
  ];

  const sunPositions = {
    morning: { cx: 10,  cy: 26 },
    midday:  { cx: 28,  cy: 8  },
    evening: { cx: 46,  cy: 26 },
  };

  function sparkPath(vals){
    const w = 56, h = 20, max = Math.max(...vals), min = Math.min(...vals);
    const step = w / (vals.length - 1);
    return vals.map((v,i) => {
      const x = i * step;
      const y = h - ((v - min) / (max - min || 1)) * h;
      return (i === 0 ? "M" : "L") + x.toFixed(1) + "," + y.toFixed(1);
    }).join(" ");
  }

  function renderList(){
    const list = document.getElementById("list");
    list.innerHTML = coins.map(c => {
      const cls = c.up ? "up" : "down";
      const arrow = c.up ? "▲" : "▼";
      const sign = c.change > 0 ? "+" : "";
      const changeStr = sign + c.change.toFixed(2).replace(".", ",") + "%";
      const strokeColor = c.up ? "#3DD68C" : "#FB6A6A";
      return `
        <div class="row">
          <img class="coin-icon" src="${ICONS[c.ticker.toLowerCase()] || ''}" alt="${c.ticker}">
          <div class="coin-id">
            <div class="coin-name">${c.name}</div>
            <div class="coin-ticker">${c.ticker}</div>
          </div>
          <div class="coin-nums">
            <div class="coin-price">${c.price}</div>
            <div class="coin-change ${cls}">${arrow} ${changeStr}</div>
          </div>
        </div>
      `;
    }).join("");
  }

  function setTheme(theme){
    const card = document.getElementById("card");
    card.setAttribute("data-theme", theme);
    const pos = sunPositions[theme];
    const sun = document.getElementById("arc-sun");
    sun.setAttribute("cx", pos.cx);
    sun.setAttribute("cy", pos.cy);
    document.querySelectorAll(".switch button").forEach(b=>{
      b.setAttribute("aria-pressed", b.dataset.theme === theme ? "true" : "false");
    });
    // re-trigger row entrance animation on theme change
    document.querySelectorAll(".row").forEach(r=>{
      r.style.animation = "none";
      r.offsetHeight;
      r.style.animation = null;
    });
  }

  document.querySelectorAll(".switch button").forEach(btn=>{
    btn.addEventListener("click", () => setTheme(btn.dataset.theme));
  });

  document.getElementById("fx-logo").src = LOGO;
  document.getElementById("brand-logo").src = LOGO;

  // ---- Данные из URL ----
  // Пример: ?theme=morning&time=09:00&date=20.08.2026&data=<base64(JSON массива coins)>
  (function applyUrlData(){
    const p = new URLSearchParams(location.search);

    const urlDate = p.get("date");
    if (urlDate) document.getElementById("date-pill").textContent = urlDate;

    const urlTime = p.get("time");
    if (urlTime) {
      const themes = { morning:"09:00", midday:"14:00", evening:"20:00" };
      // время задаём напрямую через CSS-переменную
      document.getElementById("card").style.setProperty("--time", '"' + urlTime + '"');
    }

    const urlData = p.get("data");
    if (urlData) {
      try {
        const json = decodeURIComponent(escape(atob(urlData)));
        const parsed = JSON.parse(json);
        if (Array.isArray(parsed) && parsed.length) {
          coins.length = 0;
          parsed.forEach(c => coins.push(c));
        }
      } catch (e) { console.error("bad data param", e); }
    }

    renderList();
    const theme = p.get("theme") || "morning";
    setTheme(["morning","midday","evening"].includes(theme) ? theme : "morning");

    // сигнал для скриншот-сервиса, что всё отрисовано
    document.body.setAttribute("data-ready", "1");
  })();
</script>
